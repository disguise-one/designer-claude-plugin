# Checks for each pull request.
# The d3 source is private, so this job cannot run "sync_skill.py --check".
# It checks that skills-manifest.json matches the files in skills/.
name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s scripts

      - name: Manifest matches the files in skills/
        run: python scripts/sync_skill.py --verify-manifest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the plugin
        run: claude plugin validate .
